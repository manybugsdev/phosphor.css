name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The release PR bumps package.json; rebuild so the dist/ banner matches.
      - if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
      - if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - if: ${{ steps.release.outputs.prs_created == 'true' }}
        name: Rebuild dist/ on the release PR
        run: |
          npm ci
          npm run build
          if ! git diff --quiet -- dist/; then
            git config user.name manybugsdev
            git config user.email 133523181+manybugsdev@users.noreply.github.com
            git commit -am "chore: rebuild dist"
            git push
          fi

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm publish
